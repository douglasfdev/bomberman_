name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Production
    env:
      NODE_ENV: production
      DIRECT_URL: ${{ secrets.DIRECT_URL || vars.DIRECT_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
      VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }} 
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY || vars.VPS_SSH_KEY }}
      APP_BASE_URL: ${{ secrets.APP_BASE_URL || vars.APP_BASE_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET || vars.SESSION_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || vars.GOOGLE_CLIENT_SECRET }}
      WOOVI_API_KEY: ${{ secrets.WOOVI_API_KEY || vars.WOOVI_API_KEY }}
      WOOVI_API_BASE_URL: ${{ secrets.WOOVI_API_BASE_URL || vars.WOOVI_API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Create .env
        run: |
          echo "DIRECT_URL=${{ secrets.DIRECT_URL || vars.DIRECT_URL }}" >> .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL || vars.DATABASE_URL }}" >> .env

      - name: Remove postinstall script temporarily
        run: npm pkg delete scripts.postinstall

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL || vars.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}

      - name: Build
        run: npm run build

      - name: Deploy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          username: opc
          key: ${{ secrets.VPS_SSH_KEY || vars.VPS_SSH_KEY }}
          source: "dist/,package.json,package-lock.json,prisma/"
          target: /var/www/bomberman

      - name: Start Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL || vars.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL || vars.APP_BASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || vars.SESSION_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || vars.GOOGLE_CLIENT_SECRET }}
          WOOVI_API_KEY: ${{ secrets.WOOVI_API_KEY || vars.WOOVI_API_KEY }}
          WOOVI_API_BASE_URL: ${{ secrets.WOOVI_API_BASE_URL || vars.WOOVI_API_BASE_URL }}
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          username: opc
          key: ${{ secrets.VPS_SSH_KEY || vars.VPS_SSH_KEY }}
          envs: DIRECT_URL,DATABASE_URL,APP_BASE_URL,SESSION_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,WOOVI_API_KEY,WOOVI_API_BASE_URL
          script: |
            cd /var/www/bomberman
            
            echo "NODE_ENV=production" > .env
            echo "DIRECT_URL=$DIRECT_URL" >> .env
            echo "DATABASE_URL=$DATABASE_URL" >> .env
            echo "APP_BASE_URL=$APP_BASE_URL" >> .env
            echo "SESSION_SECRET=$SESSION_SECRET" >> .env
            echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" >> .env
            echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> .env
            echo "WOOVI_API_KEY=$WOOVI_API_KEY" >> .env
            echo "WOOVI_API_BASE_URL=$WOOVI_API_BASE_URL" >> .env
            
            npm pkg delete scripts.postinstall
            npm install --omit=dev
            npx prisma generate
            npx prisma migrate deploy
            
            npm install -g pm2
            pm2 restart bomberman || pm2 start dist/bomberman/server/server.mjs --name "bomberman"