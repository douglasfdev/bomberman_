services:
  app:
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    container_name: bomberman
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/user"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
